<nav #navbar

>

  <div (click)="toggleMobileMenu()" class="sm:hidden">
    <button class="flex items-center p-3 text-white navbar-burger">
      <svg class="block w-10 h-10 fill-current" fill="none" stroke="currentColor" stroke-width="1.5"
           viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 9h16.5m-16.5 6.75h16.5"></path>
      </svg>
    </button>
  </div>

  <!-- Menu desktop gauche -->
  <ul class="navbar-left hidden sm:flex sm:mx-auto sm:items-center sm:w-auto sm:space-x-6 text-white text-sm">
    <li class="group relative">
      <a class="font-light uppercase cursor-pointer navbar-link" (click)="scrollToSection('hero')">Accueil</a>
      <div class="h-0.5 bg-white scale-x-0 group-hover:scale-100 origin-left rounded-full"></div>
    </li>
    <li class="group relative">
      <a class="font-light uppercase cursor-pointer navbar-link" (click)="scrollToSection('services')">Services</a>
      <div class="h-0.5 bg-white scale-x-0 group-hover:scale-100 origin-left rounded-full"></div>
    </li>
    <li class="group relative">
      <a class="font-light uppercase cursor-pointer navbar-link" (click)="scrollToSection('process')">Process</a>
      <div class="h-0.5 bg-white scale-x-0 group-hover:scale-100 origin-left rounded-full"></div>
    </li>
  </ul>

 <img #logo
  class="w-32 sm:w-23 md:w-32 lg:w-38 h-auto cursor-pointer logo-white" 
  src="assets/images/LGS.svg" 
  alt="logo brand">

  <!-- Menu desktop droite -->
  <ul class="navbar-right hidden sm:flex sm:mx-auto sm:items-center sm:w-auto sm:space-x-6 text-white text-sm">
    <li class="group relative">
      <a class="font-light uppercase cursor-pointer navbar-link" (click)="scrollToSection('testimony')">Témoignages</a>
      <div class="h-0.5 bg-white scale-x-0 group-hover:scale-100 origin-left rounded-full"></div>
    </li>
    <li class="group relative">
      <a class="font-light uppercase cursor-pointer navbar-link" (click)="scrollToSection('history')">À propos</a>
      <div class="h-0.5 bg-white scale-x-0 group-hover:scale-100 origin-left rounded-full"></div>
    </li>
    <li class="group relative">
      <a class="font-light uppercase cursor-pointer navbar-link" (click)="scrollToSection('contact')">Contact</a>
      <div class="h-0.5 bg-white scale-x-0 group-hover:scale-100 origin-left rounded-full"></div>
    </li>
  </ul>
</nav>

<!-- Mobile menu overlay -->
<div *ngIf="ismobileMenuOpen"
     class="fixed inset-0 z-50 flex flex-col justify-between
            bg-gradient-to-br from-[#0a0a0a] via-[#0d0d0d] to-[#050505]">

  <!-- HEADER -->
  <div class="flex justify-between items-center px-6 pt-6">
    <img src="assets/images/LGS.svg"
         alt="logo brand"
         class="w-28 h-auto cursor-pointer"
         (click)="toggleMobileMenu(); scrollToSection('hero')">

    <button (click)="toggleMobileMenu()"
      class="text-white text-4xl leading-none hover:text-[var(--gold)] transition">
      &times;
    </button>
  </div>

  <!-- MENU -->
  <nav class="flex flex-col items-center flex-1 justify-center space-y-7 text-lg">

    <a class="uppercase font-light tracking-[0.25em] text-white
              hover:text-[var(--gold)] transition"
       (click)="scrollToSection('hero'); toggleMobileMenu()">
      Accueil
    </a>

    <a class="uppercase font-light tracking-[0.25em] text-white
              hover:text-[var(--gold)] transition"
       (click)="scrollToSection('services'); toggleMobileMenu()">
      Services
    </a>

    <a class="uppercase font-light tracking-[0.25em] text-white
              hover:text-[var(--gold)] transition"
       (click)="scrollToSection('process'); toggleMobileMenu()">
      Process
    </a>

    <a class="uppercase font-light tracking-[0.25em] text-white
              hover:text-[var(--gold)] transition"
       (click)="scrollToSection('testimony'); toggleMobileMenu()">
      Témoignages
    </a>

    <a class="uppercase font-light tracking-[0.25em] text-white
              hover:text-[var(--gold)] transition"
       (click)="scrollToSection('history'); toggleMobileMenu()">
      À propos
    </a>

    <a class="uppercase font-light tracking-[0.25em] text-white
              hover:text-[var(--gold)] transition"
       (click)="scrollToSection('contact'); toggleMobileMenu()">
      Contact
    </a>

  </nav>

  <!-- CTA SECTION -->
  <div class="px-6 pb-12 space-y-4">

    <!-- POSTULER (gold like your form button) -->
    <button
      (click)="scrollToSection('contact'); toggleMobileMenu()"
      class="w-full py-3 uppercase text-xs tracking-[0.25em]
             bg-[var(--gold)] text-black rounded-sm
             hover:opacity-90 transition">
      Demande de devis
    </button>

    <!-- WhatsApp -->
    <a href="https://wa.me/32XXXXXXXXX" target="_blank"
       class="w-full flex items-center justify-center gap-2
              border border-white/10 text-white
              py-3 rounded-sm uppercase text-xs tracking-[0.25em]
              hover:border-[var(--gold)] hover:text-[var(--gold)]
              transition">
      <span class="w-2 h-2 bg-green-500 rounded-full"></span>
      WhatsApp
    </a>

  </div>
</div>
