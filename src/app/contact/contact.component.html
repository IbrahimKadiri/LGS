<!-- Contact Section -->
<section class="bg-[#0d0d0d] py-24 contact-section">
  <div class="max-w-7xl mx-auto px-6">

    <!-- CARD -->
    <div class="rounded-[32px]

             border border-[var(--gold)]/10

             bg-gradient-to-br
             from-[rgba(184,155,114,0.10)]
             via-[#111111]
             to-[#0a0a0a]
 p-8 sm:p-12 lg:p-16 shadow-[0_0_40px_rgba(0,0,0,0.4)]">

      <!-- INTRO -->
      <div class="max-w-2xl mb-14 mx-auto text-center">
        <div class="text-gradient-gold uppercase text-xs tracking-[0.35em] mb-3">
          Contact
        </div>

        <h2 class="text-3xl sm:text-4xl md:text-5xl font-light text-[#f0ede8] mb-4 leading-tight">
          Parlons de<br>votre événement
        </h2>

        <p class="text-[#9a9088] text-base sm:text-lg italic">
          Un besoin précis ou une urgence ? Notre équipe vous répond rapidement.
        </p>
      </div>

      <!-- GRID -->
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 lg:gap-20">

        <!-- INFOS -->
        <div class="space-y-10 text-[#c0b8b0]">

          <div>
            <div class="text-[var(--gold)] text-xs uppercase tracking-[0.3em] mb-2">
              Téléphone
            </div>
            <div class="text-base text-[#e7e2dc]">+32 2 000 00 00</div>
          </div>

          <div>
            <div class="text-[var(--gold)] text-xs uppercase tracking-[0.3em] mb-2">
              Email
            </div>
            <a href="mailto:contact@lgs-events.be"
               class="text-base text-[#e7e2dc] hover:text-[var(--gold)]">
              contact&#64;lgs-events.be
            </a>
          </div>

          <div>
            <div class="text-[var(--gold)] text-xs uppercase tracking-[0.3em] mb-2">
              Disponibilité
            </div>
            <div class="text-base text-[#e7e2dc]">
              Lun – Ven, 9h – 18h<br>Urgences 7j/7
            </div>
          </div>

        </div>

        <!-- FORM -->
        <form class="flex flex-col gap-6">

          <!-- ROW 1 -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
            <input type="text" placeholder="Nom"
              class="bg-[#0b0b0b] border border-white/10 rounded-md px-4 py-3 text-sm text-[#f0ede8]
              focus:border-[var(--gold)] focus:outline-none">

            <input type="text" placeholder="Société"
              class="bg-[#0b0b0b] border border-white/10 rounded-md px-4 py-3 text-sm text-[#f0ede8]
              focus:border-[var(--gold)] focus:outline-none">
          </div>

          <!-- ROW 2 -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
            <input type="email" placeholder="Email professionnel"
              class="bg-[#0b0b0b] border border-white/10 rounded-md px-4 py-3 text-sm text-[#f0ede8]
              focus:border-[var(--gold)] focus:outline-none">

            <input type="text" placeholder="Téléphone"
              class="bg-[#0b0b0b] border border-white/10 rounded-md px-4 py-3 text-sm text-[#f0ede8]
              focus:border-[var(--gold)] focus:outline-none">
          </div>

          <!-- ROW 3 -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
            <select
              class="bg-[#0b0b0b] border border-white/10 rounded-md px-4 py-3 text-sm text-[#f0ede8]
              focus:border-[var(--gold)] focus:outline-none">
              <option>Type d'événement</option>
              <option>Corporate</option>
              <option>Mariage</option>
              <option>Gala</option>
              <option>Privé</option>
            </select>

            <input type="text" placeholder="Nombre de personnes"
              class="bg-[#0b0b0b] border border-white/10 rounded-md px-4 py-3 text-sm text-[#f0ede8]
              focus:border-[var(--gold)] focus:outline-none">
          </div>

          <!-- ROW 4 -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
            <input type="text" placeholder="Date prévue"
              class="bg-[#0b0b0b] border border-white/10 rounded-md px-4 py-3 text-sm text-[#f0ede8]
              focus:border-[var(--gold)] focus:outline-none">

            <input type="text" placeholder="Lieu"
              class="bg-[#0b0b0b] border border-white/10 rounded-md px-4 py-3 text-sm text-[#f0ede8]
              focus:border-[var(--gold)] focus:outline-none">
          </div>

          <!-- MESSAGE -->
          <textarea placeholder="Décrivez votre besoin..."
            class="bg-[#0b0b0b] border border-white/10 rounded-md px-4 py-3 text-sm text-[#f0ede8] h-28 resize-none
            focus:border-[var(--gold)] focus:outline-none"></textarea>

          <!-- CTA (POSTULER STYLE IDENTIQUE) -->
          <button type="submit"
            class="inline-flex items-center justify-center gap-2 px-6 py-3 text-xs uppercase tracking-[0.2em]
            bg-[var(--gold)] text-black rounded-sm hover:opacity-90">
            Envoyer la demande
          </button>

          <!-- SECOND CTA -->
          <div class="flex items-center gap-3 mt-2 cursor-pointer group">
            <div class="w-2 h-2 bg-green-500 rounded-full"></div>
            <div class="text-[var(--gold)] text-xs tracking-[0.25em] uppercase group-hover:opacity-70">
              Contacter via WhatsApp
            </div>
          </div>

        </form>

      </div>
    </div>

  </div>
</section>
