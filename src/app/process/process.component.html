<section class="relative py-24 overflow-hidden bg-[#0a0a0a] border-y border-[#1a1a1a]">

  <!-- Intro -->
  <div class="process-header max-w-3xl mx-auto text-center mb-20 px-6">

    <div class="text-gradient-gold uppercase tracking-[0.35em] text-xs mb-4">
      Notre processus
    </div>

    <h2 class="text-4xl sm:text-5xl font-light text-[#f5f2ee] mb-5 leading-tight">
      Une organisation
      <span class="text-[var(--gold)]">
        simple et efficace
      </span>
    </h2>

    <p class="text-[#8e857d] text-base sm:text-lg leading-relaxed italic">
      De la sélection des profils jusqu’au suivi terrain,
      chaque étape est pensée pour garantir une prestation fluide.
    </p>

  </div>

  <!-- Circle Wrapper (HIDDEN ON MOBILE) -->
  <div
    class="process-step relative mx-auto px-4
           hidden sm:block

           sm:w-[500px] sm:h-[500px]
           md:w-[820px] md:h-[820px]
           xl:w-[950px] xl:h-[950px]"
  >

    <!-- Rings -->
    <div class="absolute inset-0 rounded-full border border-[var(--gold)]/20"></div>
    <div class="absolute inset-8 rounded-full border border-dashed border-[var(--gold)]/35"></div>
    <div class="absolute inset-16 rounded-full border border-white/5"></div>

    <!-- Center (HIDDEN ON MOBILE) -->
    <div class="process-center absolute inset-0 flex items-center justify-center z-10">

      <div
        class="w-24 h-24
               sm:w-32 sm:h-32
               md:w-44 md:h-44
               rounded-full
               border border-[var(--gold)]/20
               bg-[#111111]/90
               backdrop-blur-md
               flex items-center justify-center
               shadow-[0_0_40px_rgba(184,155,114,0.08)]"
      >

        <img
          src="assets/images/LGS.svg"
          alt="LGS"
          class="w-14 sm:w-20 md:w-28 object-contain opacity-95"
        />

      </div>

    </div>

    <!-- SVG -->
    <svg
      viewBox="-400 -400 800 800"
      class="absolute inset-0 w-full h-full -rotate-90"
    >

      <defs>

        <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#e6c78f" stop-opacity="0.9" />
          <stop offset="100%" stop-color="#8f6a35" stop-opacity="0.4" />
        </linearGradient>

        <marker id="arrow"
                viewBox="0 0 10 10"
                refX="8"
                refY="5"
                markerWidth="5"
                markerHeight="5"
                orient="auto-start-reverse">

          <path d="M 0 0 L 10 5 L 0 10 z"
                fill="#b89b72"
                opacity="0.7" />

        </marker>

      </defs>

      <path
        *ngFor="let step of steps; let i = index"
        [attr.d]="getArcPath(i)"
        fill="none"
        stroke="url(#goldGradient)"
        stroke-opacity="0.5"
        stroke-width="1.2"
        marker-end="url(#arrow)"
      />

    </svg>

    <!-- Steps -->
    <ng-container *ngFor="let step of steps; let i = index">

      <div
        class="absolute top-1/2 left-1/2
               w-[120px]
               sm:w-[180px]
               md:w-[240px]
               xl:w-[260px]"
        [style.transform]="
          'translate(calc(-50% + ' +
          getPosition(i).x +
          'px), calc(-50% + ' +
          getPosition(i).y +
          'px))'
        "
      >

        <!-- CARD -->
        <div
          class="group
                 bg-gradient-to-br
                 from-[rgba(184,155,114,0.14)]
                 via-[#16110c]/95
                 to-[#0f0f0f]
                 backdrop-blur-sm
                 border border-[var(--gold)]/15
                 rounded-2xl
                 p-3 sm:p-5
                 text-center
                 hover:border-[var(--gold)]/30
                 hover:shadow-[0_0_30px_rgba(184,155,114,0.10)]"
        >

          <!-- Icon -->
          <div class="w-10 h-10 mx-auto mb-3 rounded-full
                      bg-gradient-to-br from-[var(--gold)]/20 to-[var(--gold-dark)]/10
                      border border-[var(--gold)]/30
                      flex items-center justify-center">

            <lucide-icon
              [img]="step.icon"
              class="w-4 h-4 text-[var(--gold)]"
            ></lucide-icon>

          </div>

          <!-- Number -->
          <div class="text-[88px] sm:text-[20px] md:text-[22px]
                      tracking-[0.35em]
                      text-gradient-gold
                      mb-2">
            {{ step.number }}
          </div>

          <!-- Title -->
          <h4 class="text-[#f5f2ee]
                     text-[11px]
                     sm:text-sm
                     md:text-base
                     leading-tight mb-2">

            {{ step.title }}

          </h4>

          <!-- Desc -->
          <p class="hidden sm:block
                    text-[10px]
                    md:text-xs
                    text-[#8b8178]
                    leading-relaxed">

            {{ step.desc }}

          </p>

        </div>

      </div>

    </ng-container>

  </div>

  <!-- MOBILE VERSION (simple vertical fallback) -->
  <div class="sm:hidden px-6 space-y-6">

    <div
      *ngFor="let step of steps; let i = index"
      class="bg-[#0f0f0f] border border-[var(--gold)]/10 rounded-xl p-5"
    >

      <div class="flex items-center gap-4 mb-3">

        <div class="text-[14px] text-gradient-gold font-light">
          {{ step.number }}
        </div>

        <h4 class="text-[#f5f2ee] text-sm">
          {{ step.title }}
        </h4>

      </div>

      <p class="text-[#8b8178] text-xs leading-relaxed">
        {{ step.desc }}
      </p>

    </div>

  </div>

</section>
